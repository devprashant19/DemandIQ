name: DemandIQ Continuous Deployment (CD)

on:
  workflow_run:
    workflows: ["DemandIQ Continuous Integration (CI)"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build Docker Container & Publish to GHCR
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx Engine
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata & Tags for Docker Image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # =========================================================================
      # AUTOMATIC VS. MANUAL STREAMLIT COMMUNITY CLOUD / RENDER DEPLOYMENT NOTICE
      # =========================================================================
      # Note: Streamlit Community Cloud deployments rely on OAuth-based GitHub Webhooks
      # configured directly inside the Streamlit Cloud Console GUI (https://share.streamlit.io).
      # Once linked, every push to main automatically redeploys without manual scripted API steps.
      #
      # Alternatively, to automate deployments to Render or Railway via CI trigger hooks,
      # configure your RENDER_DEPLOY_HOOK_URL in repository secrets and uncomment the step below:
      #
      # - name: Trigger Render Container Redeployment Webhook
      #   run: |
      #     echo "Initiating automated webhook deployment to Render..."
      #     curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
      # =========================================================================
