name: DemandIQ Continuous Integration (CI)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  linting:
    name: 🧹 Code Quality & Style (Ruff & Black)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Ruff Linter
        run: ruff check .

      - name: Verify Code Formatting (Black)
        run: black --check .

  type-checking:
    name: 🔬 Static Type Verification (Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Project Dependencies & Mypy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run Mypy Type Checking
        run: mypy src/

  test-data-schema:
    name: 💾 Unit Tests - Data Engine & Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Project & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run Data Engine & Schema Unit Tests
        run: pytest tests/test_data_generate.py tests/test_loader.py -v

  test-features:
    name: ⚙️ Unit Tests - Feature Engineering & Zero-Leakage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Project & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run Feature Engineering Unit Tests
        run: pytest tests/test_features.py -v

  test-models:
    name: 📈 Unit Tests - Forecasters, SHAP & Anomaly Detectors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Project & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run Model, SHAP Explainability & Anomaly Tests
        run: pytest tests/test_forecaster.py tests/test_cross_validate.py tests/test_explain.py tests/test_anomaly_detector.py -v

  integration-and-coverage:
    name: 🏆 Integration Pipeline & Line Coverage Verification (>=85%)
    needs: [linting, type-checking, test-data-schema, test-features, test-models]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Project & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run End-to-End Pipeline Tests & Assert >=85% Total Coverage
        run: pytest --cov=src/demandiq --cov-report=xml --cov-report=term --cov-fail-under=85 -v

      - name: Upload Test Coverage XML Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage-xml
          path: coverage.xml
          retention-days: 14
