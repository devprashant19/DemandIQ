name: DemandIQ Continuous Integration (CI)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-lint:
    name: Build, Type Check, and Execute Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Project Dependencies & Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run Ruff Linting
        run: |
          ruff check .

      - name: Verify Code Formatting (Black)
        run: |
          black --check .

      - name: Execute Static Type Checks (Mypy)
        run: |
          mypy src/

      - name: Run Pytest Test Suite with Coverage Validation (>=85%)
        run: |
          pytest --cov=src/demandiq --cov-report=xml --cov-report=term --cov-fail-under=85
        # Ensures build fails on any regression or coverage deficit without continue-on-error

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage-xml
          path: coverage.xml
          retention-days: 14
